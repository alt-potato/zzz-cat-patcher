[mod-setting-description]
cat-patcher-validate-corpse-mapping=This fixes a known issue with Metal and Stars and certain character mods. Disable at your own risk!
cat-patcher-vtk-over-aai-cannon-shells=Disables AAI Programmable Vehicles' precision cannon shells in favor of VTK Cannon Turret's cannon magezines.
cat-patcher-remove-mas-antimatter-bots=Removes antimatter bots and renames antimatter to "Antimatter Catalyst". Intended for use with Fusion Robots, since both do the same thing.
cat-patcher-remove-manual-color-module=Intended for use with cybersyn/ltm.
cat-patcher-electric-trains-on-moshine=In case you want to use Electric Trains instead of SE Space Trains.
cat-patcher-remove-floating-long-stack-inserter=Removes floating long stack inserters (the Moshine ones), but only if the runtime setting (for Moshine) disabling them is enabled, in which case they wouldn't be accessible anyway. I don't know why you would want to disable this.
cat-patcher-remove-floating-bioluminescents=Removes belts/inserters that are both floating and bioluminescent, since I'm pretty sure they're not useful on Tenebris.
