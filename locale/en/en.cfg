[mod-setting-name]
cat-patcher-mas-skin-patches=Enable Metal and Stars skin patches
cat-patcher-vtk-over-aai-cannon-shells=Enable consolidation of VTK/AAI cannon shells
cat-patcher-remove-mas-antimatter-bots=Enable removal of Metal and Stars antimatter bots

[mod-setting-description]
cat-patcher-mas-skin-patches=May lead to a crash if disabled when corresponding mods are installed. Disable at your own risk!
cat-patcher-vtk-over-aai-cannon-shells=Disables AAI Programmable Vehicles' precision cannon shells in favor of VTK Cannon Turret's cannon magezines.
cat-patcher-remove-mas-antimatter-bots=Removes antimatter bots and renames antimatter to "Antimatter Catalyst". Intended for use with Fusion Robots, since both do the same thing.